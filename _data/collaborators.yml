# Institutions of all co-authors, ordered by the first paper we wrote together.
# logos[].dark: "invert" lightens a dark logo in the dark theme (hues are kept);
#               omit it for logos that already read well on both themes.
# logos[].dark_src: a separate image used in the dark theme.
# logos[].height: height in px, for a logo the default 26px leaves too small.
# key: referenced by `institutions:` in each _publications/*.md so that clicking
#      a logo filters the publication list.
# type: `research` (universities and government labs) or `industry`; picks the
#       group the logo is shown under. Entries without one count as research.
- name: Rochester Institute of Technology
  key: rit
  type: research
  url: https://www.rit.edu/
  logos:
    - src: /assets/images/institutions/rit.png
