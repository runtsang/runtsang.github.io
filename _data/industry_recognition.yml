# Companies in the Industry Recognition block on the homepage, best known first.
# name:  must match the `name` used under `industry_recognition:` in the papers
#        (_publications/*.md). A company shows here only if some paper lists it,
#        and clicking its logo filters the publication list to those papers.
# logos: as in collaborators.yml (`dark: invert`, `dark_src`); an entry without
#        `logos:` shows the name as text. The SVGs in assets/images/industry/ come
#        from Wikimedia Commons (Baidu's from English Wikipedia) and are the
#        companies' trademarks, used here only to name them.
- name: Microsoft
  url: https://www.microsoft.com/
  logos:
    - src: /assets/images/industry/microsoft.svg
- name: Amazon
  url: https://www.amazon.science/
  logos:
