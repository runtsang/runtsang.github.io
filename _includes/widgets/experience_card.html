{% if site.data.profile.education %}
<div id="education" class="exp-section section-anchor">
    <h2 class="panel-title">Education</h2>
    <ul class="edu-list list-unstyled mb-0">
        {% for item in site.data.profile.education %}
        <li class="edu-item">
            <img src="{{ item.logo | relative_url }}" alt="" class="edu-logo">
            <div class="edu-body">
                <div class="exp-header">
                    <div class="exp-company-name">{{ item.name }}</div>
                    <span class="exp-date">{{ item.date }}</span>
                </div>
                {% if item.dept %}<div class="exp-desc">{{ item.dept }}</div>{% endif %}
                <div class="exp-role">{{ item.position }}</div>
            </div>
        </li>
        {% endfor %}
    </ul>
</div>
{% endif %}
